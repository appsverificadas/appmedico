<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador Oficial MRx - Clínicas y Policonsultorios</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .ui-container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-top: 30px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-row > div { flex: 1; min-width: 200px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .med-box { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 20px; }
        .btn { background: #000; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #007bff; margin-top: 10px; width: 100%; }
        .btn-generate { background: #28a745; font-size: 18px; width: 100%; padding: 15px; margin-top: 20px; }
        #med-list { margin-top: 15px; font-size: 14px; }
        .med-item { background: white; padding: 10px; border: 1px solid #eee; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .section-prof { background: #eef2f7; padding: 15px; border-radius: 6px; border-left: 4px solid #0F4C81; margin-bottom: 20px; }
        
        #print-area { display: none; }

        @media print {
            @page { size: A4; margin: 0; } 
            body { background: white; margin: 0; padding: 0; }
            .ui-container { display: none !important; }
            #print-area { display: block; width: 100%; color: #000; }
            .pdf-page { padding: 15mm; box-sizing: border-box; height: 297mm; position: relative; }
            .text-center { text-align: center; }
            p { margin: 2px 0; font-size: 11pt; }
            .pink-title { color: #FF007F; font-weight: bold; font-size: 12pt; text-align: center; margin-top: 5px; margin-bottom: 10px; }
            .main-header { font-weight: bold; font-size: 12pt; margin-bottom: 15px; }
            .barcode-svg { height: 60px; margin-top: 5px; }
            .barcode-sub { font-size: 13pt; margin-bottom: 15px; letter-spacing: 1px; }
            .patient-info { margin-top: 20px; margin-bottom: 20px; }
            .patient-info p { font-size: 10pt; }
            .rp-title { font-weight: bold; font-size: 12pt; margin-bottom: 15px; }
            .rp-list { margin: 0; padding-left: 20px; }
            .rp-list li { margin-bottom: 15px; font-style: italic; }
            .rp-details { margin-left: 0; font-style: normal; }
            .rp-details p { font-size: 10.5pt; }
            .signature-block { margin-top: 30px; }
            .signature-block p { font-size: 10pt; }
            .italic-bold { font-style: italic; font-weight: bold; font-size: 11pt; margin-bottom: 5px;}
            .grey-text { color: #666; font-size: 9pt; text-align: center; }
            .separator { border-bottom: 1px solid #000; margin: 10px 0; }
            .footer-flex { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; }
            .mrx-logo-container { width: 85px; height: 85px; flex-shrink: 0; margin-left: 10px; display: flex; align-items: center; justify-content: center; }
            .mrx-logo-img { width: 100%; height: 100%; object-fit: contain; }
            .qr-box { display: flex; align-items: center; gap: 15px; }
            .small-footer { font-size: 8pt; text-align: center; }
            .qr-container canvas, .qr-container img { width: 120px !important; height: 120px !important; }
        }
    </style>
</head>
<body>

    <div class="ui-container" id="interfaz-principal">
        <h1 style="color:#0F4C81; text-align:center; margin-top:0;">Sistema de Recetas MRx</h1>
        
        <div class="section-prof">
            <h3 style="margin-top:0; color:#0F4C81;">1. Configuración del Profesional</h3>
            <div class="form-row">
                <div style="flex: 2;"><label>Nombre y Apellido</label><input type="text" id="med_nombre" value="BARBERA MIRET, FRANCISCO"></div>
                <div><label>Especialidad</label><input type="text" id="med_esp" value="MEDICINA INTEGRATIVA / PSIQUIATRÍA"></div>
                <div><label>Profesión</label><input type="text" id="med_prof" value="Médico"></div>
            </div>
            <div class="form-row">
                <div><label>Matrícula</label><input type="text" id="med_mat" value="MN 158282"></div>
                <div><label>REFEPS</label><input type="text" id="med_refeps" value="541033444821"></div>
                <div><label>Dirección del Consultorio</label><input type="text" id="med_dir" value="Av. Siempre Viva 123"></div>
            </div>
        </div>

        <h2>2. Datos del Paciente</h2>
        <div class="form-row">
            <div><label>Paciente</label><input type="text" id="paciente" placeholder="Ej: GONZALEZ, JUAN LUCAS"></div>
            <div><label>D.N.I.</label><input type="text" id="dni"></div>
            <div><label>CUIL</label><input type="text" id="cuil"></div>
        </div>
        <div class="form-row">
            <div><label>Sexo</label><select id="sexo"><option>M</option><option>F</option><option>X</option></select></div>
            <div><label>Nacimiento</label><input type="text" id="nacimiento" placeholder="DD/MM/AAAA"></div>
            <div><label>Obra Social</label><input type="text" id="os" value="Paciente Particular"></div>
            <div><label>Nro Afiliado</label><input type="text" id="afiliado"></div>
        </div>

        <h2>3. Prescripción (Autocompletado Activo)</h2>
        <div class="med-box">
            <div class="form-row">
                <div style="flex: 2;">
                    <label>Droga / Presentación</label>
                    <input list="lista-meds" id="rx_nombre" placeholder="Buscar medicamento...">
                    <datalist id="lista-meds"></datalist>
                </div>
                <div><label>Cantidad</label><input type="number" id="rx_cant" value="1"></div>
                <div style="flex: 2;">
                    <label>Diagnóstico CIE-10</label>
                    <input list="lista-diag" id="rx_diag" placeholder="Buscar diagnóstico...">
                    <datalist id="lista-diag"></datalist>
                </div>
            </div>
            <button class="btn btn-add" onclick="agregarMed()">+ Añadir a la receta</button>
            <div id="med-list"></div>
        </div>

        <div class="form-row">
            <div style="flex: 1;">
                <label>Posología / Notas</label>
                <input list="lista-pos" id="posologia" placeholder="Ej: 1 comp / 24 hs">
                <datalist id="lista-pos"></datalist>
            </div>
        </div>

        <button class="btn btn-generate" onclick="prepararImpresion()">Generar PDF Oficial MRx</button>
    </div>

    <div id="print-area"></div>

    <script>
        const dbMedicamentos = [

            "ketorolac, 10 mg comp. sublingual x 10", "ketorolac, 30 mg comp. sublingual x 10",
            "ketorolac, 30 mg iny. x 3 amp.", "ketorolac, 60 mg/2ml iny. x 3 amp.",
            "tramadol, 50 mg iny. x 5 amp.", "tramadol, 100 mg iny. x 3 amp.",
            "nalbufina, 10 mg/ml iny. x 3 amp.",
            "diclofenac, 75 mg iny. x 5 amp.", "diclofenac + pridinol, iny. x 3 amp.",
            "piroxicam, 20 mg comp. sublingual x 10",

            "betametasona (acetato+fosfato) de depósito, 3 mg/ml iny. x 1 amp. (Cronocorteroid)",
            "dexametasona, 8 mg/2ml iny. x 3 amp.", "betametasona, 4 mg/ml iny. x 1 amp.",
            "hidrocortisona, 100 mg iny. x 1 f.a.", "hidrocortisona, 500 mg iny. x 1 f.a.",
            "metilprednisolona, 500 mg iny. x 1 f.a.",

            // --- SUBLINGUALES GENERALES ---
            "clonazepam, 0.25 mg comp. sublingual x 30", "alprazolam, 0.5 mg comp. sublingual x 30",
            "lorazepam, 1 mg comp. sublingual x 30", "isosorbide dinitrato, 5 mg comp. sublingual x 30",

            // --- GOTAS (OFTÁLMICAS, ÓTICAS, ORALES Y NEBULIZACIÓN) ---
            "clonazepam, 2.5 mg/ml gotas orales x 20 ml", "haloperidol, 2 mg/ml gotas orales x 20 ml",
            "risperidona, 1 mg/ml gotas orales x 30 ml", "metoclopramida, 10 mg/ml gotas orales x 20 ml",
            "hioscina butilbromuro (Buscapina), 20 mg/ml gotas x 20 ml", "paracetamol, 100 mg/ml gotas orales x 20 ml",
            "ibuprofeno, 40 mg/ml susp. gotas x 30 ml", "betametasona, 0.5 mg/ml gotas orales x 30 ml",

            "latanoprost, 0.005% gotas oftálmicas x 2.5 ml", "ketorolac, 0.5% gotas oftálmicas x 5 ml",
            
            // --- CLÍNICA MÉDICA, CARDIOLOGÍA, ENDOCRINO E INFECTO ---
            "losartán, 50 mg comp.x 30", "valsartán, 160 mg comp.x 30", "enalapril, 10 mg comp.x 30",
            "amlodipina, 5 mg comp.x 30", "bisoprolol, 5 mg comp.x 30", "carvedilol, 12.5 mg comp.x 30",
            "rosuvastatina, 20 mg comp.x 30", "atorvastatina, 20 mg comp.x 30", "aspirina, 100 mg comp.x 30",
            "metformina, 850 mg comp.x 30", "glimepirida, 2 mg comp.x 30", "levotiroxina, 100 mcg comp.x 50",
            "omeprazol, 20 mg caps.x 30", "pantoprazol, 40 mg comp.x 30", "trimebutina, 200 mg comp.x 30",
            "amoxicilina, 500 mg comp.x 21", "amoxicilina + ac. clavulánico 875/125 mg comp.x 14",
            "cefalexina, 500 mg comp.x 16", "ciprofloxacina, 500 mg comp.x 10", "azitromicina, 500 mg comp.x 5",
            "ibuprofeno, 600 mg comp.x 20", "paracetamol, 1g comp.x 20", "meprednisona, 8 mg comp.x 20"

        const dbDiagnosticos = [
            // ANSIEDAD Y TRASTORNOS RELACIONADOS (INTEGRATIVA Y PSIQUIATRÍA)
            "F40.0 - Agorafobia", "F40.1 - Fobias sociales", "F40.2 - Fobias específicas (aisladas)",
            "F41.0 - Trastorno de pánico [ansiedad paroxística episódica]", "F41.1 - Trastorno de ansiedad generalizada", 
            "F41.2 - Trastorno mixto ansioso-depresivo", "F41.8 - Otros trastornos de ansiedad especificados", "F41.9 - Trastorno de ansiedad, no especificado",
            "F43.0 - Reacción a estrés agudo", "F43.1 - Trastorno de estrés postraumático", "F43.2 - Trastornos de adaptación",
            "F45.0 - Trastorno de somatización", "F48.0 - Neurastenia (fatiga crónica / estrés severo)",
            "G47.0 - Trastornos del inicio y del mantenimiento del sueño [insomnio]",
            "G47.9 - Trastorno del sueño, no especificado",

            // DOLOR CRÓNICO Y PATOLOGÍAS INTEGRATIVAS
            "M79.7 - Fibromialgia", "G50.0 - Neuralgia del trigémino", "M54.1 - Radiculopatía",
            "R52.1 - Dolor crónico intratable", "R52.2 - Otro dolor crónico especificado",

            // ODONTOLOGÍA Y ESTOMATOLOGÍA
            "K01.1 - Dientes impactados", "K04.0 - Pulpitis", "K04.7 - Absceso periapical sin fístula",
            "K05.2 - Periodontitis aguda", "K12.0 - Estomatitis aftosa recurrente", "K05.0 - Gingivitis aguda",

            // CLÍNICA MÉDICA Y CARDIOLOGÍA
            "I10 - Hipertensión esencial (primaria)", "I20.9 - Angina de pecho, no especificada",
            "I50.9 - Insuficiencia cardíaca, no especificada", "E78.5 - Hiperlipidemia, no especificada",
            
            // ENDOCRINOLOGÍA Y GASTRO
            "E11.9 - Diabetes mellitus tipo 2 sin complicaciones", "E03.9 - Hipotiroidismo, no especificado",
            "K21.9 - Enfermedad del reflujo gastroesofágico sin esofagitis", "K58.9 - Síndrome del intestino irritable sin diarrea",
            
            // TRAUMATOLOGÍA
            "M54.5 - Lumbago no especificado", "M54.4 - Lumbago con ciática", "M54.2 - Cervicalgia",
            "M17.9 - Gonartrosis, no especificada", "S93.4 - Esguince y torcedura del tobillo",
            
            // GENERAL
            "Z00.0 - Examen médico general", "R51 - Cefalea", "H10.9 - Conjuntivitis, no especificada"
        ];

        const dbPosologias = [
            "1 comp / 24 hs.", "1 comp / 12 hs.", "1 comp / 8 hs.",
            "1/2 comp / 24 hs.", "1/2 comp a la mañana, 1/2 comp a la noche.",
            "1 comp por la noche antes de dormir.", 
            "Tomar 10 gotas sublinguales cada 8 hs.", "Tomar 15 gotas diluidas en agua antes de dormir.",
            "Vaporizar e inhalar según necesidad ante síntomas de ansiedad.",
            "Dejar disolver 1 comp debajo de la lengua.", "Dejar disolver debajo de la lengua en caso de dolor/crisis.",
            "Aplicar parche sobre piel limpia cada 72 hs.", "Aplicar parche sobre piel limpia cada 7 días.",
            "Tomar con el desayuno.", "Tomar lejos de las comidas.", "Tomar 30 minutos antes del desayuno.",
            "Uso odontológico exclusivo en consultorio.",
            "Aplicar 1 ampolla IM por única vez.", "Aplicar 1 ampolla IM cada 12 hs.",
            "Aplicar 1 gota en cada ojo afectado cada 12 hs.", "Aplicar 2 gotas en el oído afectado cada 8 hs.",
            "Nebulizar con 20 gotas + 3ml de solución fisiológica cada 8 hs.",
            "Aplicar 1 puff cada 12 hs.", "Según indicación médica."
        ];

        let medicamentos = [];

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('d');

            if(dataParam) {
                document.getElementById('interfaz-principal').innerHTML = "<h2 style='text-align:center; color:#0F4C81; margin-top:50px;'>Procesando validación... Aguarde.</h2>";
                
                try {
                    const decodedStr = decodeURIComponent(escape(atob(dataParam)));
                    const d = JSON.parse(decodedStr);
                    
                    const fullData = {
                        paciente: d.p, dni: d.d, cuil: d.c, sexo: d.s, nacimiento: d.n,
                        os: d.o, afiliado: d.a, posologia: d.po, fecha: d.f, hora: '', recetarioNro: d.id,
                        medicamentos: d.m.map(x => ({nombre: x[0], cant: x[1], diag: x[2]})),
                        med_nombre: d.dn, med_esp: d.de, med_prof: d.dp, med_mat: d.dm, med_refeps: d.dr, med_dir: d.dd
                    };
                    
                    renderizarRecetaFinal(fullData);
                    setTimeout(() => { window.print(); }, 1500);
                } catch(e) {
                    document.getElementById('interfaz-principal').innerHTML = "<h2 style='text-align:center; color:red; margin-top:50px;'>❌ Error: Código QR inválido.</h2>";
                }
            } else {
                const poblarDatalist = (id, array) => {
                    const list = document.getElementById(id);
                    array.forEach(item => { let opt = document.createElement('option'); opt.value = item; list.appendChild(opt); });
                };
                poblarDatalist("lista-meds", dbMedicamentos);
                poblarDatalist("lista-diag", dbDiagnosticos);
                poblarDatalist("lista-pos", dbPosologias);
            }
        };

        function agregarMed() {
            const nombre = document.getElementById('rx_nombre').value;
            const cant = document.getElementById('rx_cant').value;
            const diag = document.getElementById('rx_diag').value;
            if(!nombre) return alert("Ingresá un medicamento");
            
            medicamentos.push({ nombre, cant, diag });
            document.getElementById('rx_nombre').value = '';
            document.getElementById('rx_diag').value = '';
            renderMeds();
        }

        function renderMeds() {
            const caja = document.getElementById('med-list');
            caja.innerHTML = medicamentos.map((m, i) => `
                <div class="med-item">
                    <span><b>${m.nombre}</b> (Cant: ${m.cant})</span>
                    <button onclick="borrarMed(${i})" style="color:red;border:none;background:none;cursor:pointer;">X</button>
                </div>
            `).join('');
        }

        function borrarMed(index) {
            medicamentos.splice(index, 1);
            renderMeds();
        }

        function prepararImpresion() {
            if(medicamentos.length === 0) return alert("Agregá al menos un medicamento a la lista.");

            const dataParaPDF = {
                paciente: document.getElementById('paciente').value || "No indicado",
                dni: document.getElementById('dni').value || "-",
                cuil: document.getElementById('cuil').value || "-",
                sexo: document.getElementById('sexo').value,
                nacimiento: document.getElementById('nacimiento').value || "-",
                os: document.getElementById('os').value || "Paciente Particular",
                afiliado: document.getElementById('afiliado').value || "-",
                posologia: document.getElementById('posologia').value || "Según indicación.",
                fecha: new Date().toLocaleDateString('es-AR'),
                hora: new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit'}),
                recetarioNro: Math.floor(Math.random() * 1000000000000).toString(), 
                medicamentos: medicamentos,
                med_nombre: document.getElementById('med_nombre').value,
                med_esp: document.getElementById('med_esp').value,
                med_prof: document.getElementById('med_prof').value,
                med_mat: document.getElementById('med_mat').value,
                med_refeps: document.getElementById('med_refeps').value,
                med_dir: document.getElementById('med_dir').value
            };

            renderizarRecetaFinal(dataParaPDF);
            setTimeout(() => { window.print(); }, 800);
        }

        function renderizarRecetaFinal(data) {
            const htmlOriginal = generarPaginaHTML(data, false);
            const htmlDuplicado = generarPaginaHTML(data, true);
            document.getElementById('print-area').innerHTML = htmlOriginal + htmlDuplicado;

            const opcionesBarcode = { format: "CODE128", displayValue: false, margin: 0, height: 60, width: 2.5 };
            JsBarcode("#bar-recetario-orig", data.recetarioNro, opcionesBarcode);
            JsBarcode("#bar-afiliado-orig", data.afiliado !== "-" ? data.afiliado : data.dni, opcionesBarcode);
            JsBarcode("#bar-recetario-dup", data.recetarioNro, opcionesBarcode);
            JsBarcode("#bar-afiliado-dup", data.afiliado !== "-" ? data.afiliado : data.dni, opcionesBarcode);

            const compactData = {
                p: data.paciente, d: data.dni, c: data.cuil, s: data.sexo, n: data.nacimiento,
                o: data.os, a: data.afiliado, po: data.posologia, f: data.fecha, id: data.recetarioNro,
                m: data.medicamentos.map(x => [x.nombre, x.cant, x.diag]), 
                dn: data.med_nombre, de: data.med_esp, dp: data.med_prof, dm: data.med_mat, dr: data.med_refeps, dd: data.med_dir
            };

            const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(compactData))));
            const linkEscaneo = window.location.href.split('?')[0] + "?d=" + encodedData;
            
            new QRCode(document.getElementById("qr-orig"), { text: linkEscaneo, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.L });
            new QRCode(document.getElementById("qr-dup"), { text: linkEscaneo, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.L });
        }

        function generarPaginaHTML(data, esDuplicado) {
            const sufijo = esDuplicado ? 'dup' : 'orig';
            const medsHTML = data.medicamentos.map(m => `
                <li>${m.nombre}
                    <div class="rp-details">
                        <p><strong>Cantidad:</strong> ${m.cant}</p>
                        ${m.diag ? `<p><strong>Diagnóstico:</strong> ${m.diag}</p>` : ''}
                    </div>
                </li>
            `).join('');

            return `
                <div class="pdf-page" style="${esDuplicado ? 'page-break-before: always;' : ''}">
                    ${esDuplicado ? '<div class="pink-title">Duplicado</div>' : ''}
                    
                    <div class="text-center">
                        <p class="main-header">Fecha Receta: ${data.fecha}</p>
                        <p style="font-weight: bold; margin-bottom: 5px;">Recetario:</p>
                        <svg id="bar-recetario-${sufijo}" class="barcode-svg"></svg>
                        <p class="barcode-sub">${data.recetarioNro}</p>
                        <p style="font-weight: bold; margin-bottom: 5px; margin-top: 10px;">Nro Afiliado:</p>
                        <svg id="bar-afiliado-${sufijo}" class="barcode-svg"></svg>
                        <p class="barcode-sub">${data.afiliado !== "-" ? data.afiliado : data.dni}</p>
                    </div>

                    <div class="patient-info">
                        <p><strong>OS:</strong> ${data.os}</p>
                        <p><strong>Afiliado:</strong> ${data.paciente}</p>
                        <p><strong>D.N.I.:</strong> ${data.dni}</p>
                        <p><strong>CUIL:</strong> ${data.cuil}</p>
                        <p><strong>Sexo:</strong> ${data.sexo}</p>
                        <p><strong>Fecha Nacimiento:</strong> ${data.nacimiento}</p>
                    </div>

                    <p class="rp-title">RP/</p>
                    <ul class="rp-list">
                        ${medsHTML}
                    </ul>

                    <div class="signature-block">
                        <p class="italic-bold">Firmado electrónicamente por:</p>
                        <p><strong>Dr/a:</strong> ${data.med_nombre}</p>
                        <p><strong>REFEPS:</strong> ${data.med_refeps}</p>
                        <p><strong>Matricula:</strong> ${data.med_mat}</p>
                        <p><strong>Profesión:</strong> ${data.med_prof}</p>
                        <p><strong>Especialidad:</strong> ${data.med_esp}</p>
                        <p><strong>Dirección:</strong> ${data.med_dir}</p>
                    </div>

                    <div style="margin-top: 20px;">
                        <p><strong>Posología / Notas:</strong></p>
                        <p>${data.posologia}</p>
                    </div>

                    <div style="margin-top: 30px;">
                        <p class="grey-text">Emitida: ${data.fecha} ${data.hora}</p>
                        <p class="grey-text">Esta receta debe validarse on-line ingresando el número de recetario o autorización</p>
                    </div>

                    <div class="separator"></div>

                    <div class="footer-flex">
                        <div class="mrx-logo-container">
                            <img src="icono.png" class="mrx-logo-img" alt="Logo MRx">
                        </div>

                        <div class="qr-box">
                            <span style="font-size: 11pt;">Firma Electrónica:</span>
                            <div id="qr-${sufijo}" class="qr-container"></div>
                        </div>
                    </div>

                    <p class="grey-text" style="margin-top: 10px;">La firma electrónica sustituye legalmente a la firma ológrafa</p>

                    <div class="separator"></div>

                    <p class="small-footer">Buscador Nacional de Medicamentos:<br><a href="#" style="color:blue; text-decoration:underline;">https://www.argentina.gob.ar/buscador-de-precios-de-medicamentos</a></p>
                    <p class="small-footer" style="margin-top: 10px;">Esta receta fue creada por un emisor inscripto y validado en el Registro de Recetarios Electrónicos del<br>Ministerio de Salud de la Nación (Resolución RL-2024-91317760-APN-SSVEIYES#MS)</p>
                </div>
            `;
        }
    </script>
</body>
</html>
